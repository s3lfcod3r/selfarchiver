services:
    selfarchiver:
        # Build locally, or swap for the published image:
        # image: ghcr.io/kabelsalatundklartext/selfarchiver:latest
        build: .
        image: ghcr.io/kabelsalatundklartext/selfarchiver:latest
        container_name: selfarchiver
        restart: unless-stopped
        ports:
            - '${PORT:-3000}:3000'
        environment:
            # Stable secret for encrypting stored mailbox passwords + signing sessions.
            # Generate one with: openssl rand -hex 32
            APP_SECRET: ${APP_SECRET:-}
            # Optional: protect the UI with a single password. Leave empty for an open instance.
            AUTH_PASSWORD: ${AUTH_PASSWORD:-}
            # Timezone used to evaluate per-rule cron schedules.
            TZ: ${TZ:-Europe/Berlin}
            CRON_TZ: ${CRON_TZ:-${TZ:-Europe/Berlin}}
            LOG_LEVEL: ${LOG_LEVEL:-info}
        volumes:
            # Holds the SQLite database and the .eml archive.
            - ./data:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
